{% extends 'base.html' %}

{% block title %}FlowWatch Portal - Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>Create Account</h1>
        <p>Access the student anomaly forecasting platform</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label for="username">Choose Username</label>
            <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign in here</a>
    </div>
</div>
{% endblock %}
