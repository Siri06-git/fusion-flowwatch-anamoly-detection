{% extends 'base.html' %}

{% block title %}FlowWatch Portal - Sign In{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-header">
        <h1>FlowWatch</h1>
        <p>Predictive Student Analytics Dashboard</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Register here</a>
    </div>
</div>
{% endblock %}
